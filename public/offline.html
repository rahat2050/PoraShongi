<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <title>অফলাইন · PoraSathi</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8fafc;color:#0f172a;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}.card{width:min(100%,440px);border:1px solid #cbd5e1;border-radius:20px;background:#fff;padding:32px;text-align:center;box-shadow:0 10px 30px #0f172a14}.mark{width:56px;height:56px;margin:auto;display:grid;place-items:center;border-radius:16px;background:#0f766e;color:white;font-size:28px}h1{font-size:24px;margin:20px 0 8px}p{color:#475569;line-height:1.6;margin:0 0 24px}button{min-height:44px;border:0;border-radius:10px;background:#0f766e;color:#fff;padding:10px 20px;font:inherit;font-weight:600;cursor:pointer}@media(prefers-color-scheme:dark){body{background:#0f172a;color:#f1f5f9}.card{background:#1e293b;border-color:#475569}p{color:#cbd5e1}}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">🎓</div>
    <h1>আপনি এখন অফলাইনে আছেন</h1>
    <p>ইন্টারনেট সংযোগ ফিরে এলে PoraSathi আবার ব্যবহার করতে পারবেন।</p>
    <button type="button" onclick="location.reload()">আবার চেষ্টা করুন</button>
  </main>
</body>
</html>
